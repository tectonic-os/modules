---
name: Build the collection
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

# Every leg scaffolds a repository with the released tool and imports out of
# this checkout, so what an importer gets is what is tested: `create repo`,
# `import module` and the lint every repository runs are covered beside the
# modules themselves. The legs differ only in which modules they import.
#
#   collection  every module claiming the family. A smoke test for the
#               scaffold-import-lint-build path, and not a compatibility proof:
#               collect order is declared, so two modules writing one path do
#               not collide, the later silently wins, and the build cannot fail
#               on overlap. The overlap is reported instead.
#   bootc-base  the `deb-family` set alone, closed over `requires`, on a
#               Debian or Ubuntu container image rather than a bootc one. The
#               set that turns the first into the second, built on its own so a
#               failure in it is not read as a failure of the content above it.
#
# There is no leg on a published deb bootc base. Every one of those ships an
# empty dpkg database, so an image built on one reports its whole base as
# carrying no packages and therefore no CVEs, which is the one answer this
# project exists not to give. The collection builds its own.
#   hardening   the hardening set alone, where claims are measured. Its own
#               image so a failing claim and the set's own composition stay out
#               of the leg that gates every other module.
#   changed     what this event touched, closed over `requires`, scaffolded and
#               generated but never built. A diff is not importable on its own:
#               a module whose requirement nothing in the image provides is an
#               unmet-requires error, so the closure is walked from the
#               providers rather than filtered from the diff. One per family,
#               because a widened module's `requires`, `after` and
#               `requires-file` can be satisfiable on one family and dangling
#               on another, and building nothing makes three of them cheap.
#   packages    every `packages` batch a family declares, resolved by apt in a
#               container of that family and nothing else. It builds no image,
#               so it costs seconds, and it fails on the one defect a widened
#               module can introduce that `tect check` cannot see: a package
#               name that does not exist, or a set apt cannot satisfy.
jobs:
  # The two deb `collection` legs carry the largest module set and are the
  # queue's bottleneck, which is why `NEXT-42` parked the Debian one. They are
  # not dropped, they are moved off the pull request: a push to `main` and the
  # weekly schedule run them, and a pull request gets `packages` instead, which
  # resolves every declared name on both families in seconds. So the defect a
  # module edit can actually introduce is caught before merge, and the full
  # build still gates `main`.
  legs:
    name: Choose the legs for this event
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          always='[
            {"image":"collection","family":"fedora","base":"quay.io/fedora/fedora-bootc:44"},
            {"image":"bootc-base","family":"debian","base":"docker.io/library/debian:forky"},
            {"image":"bootc-base","family":"ubuntu","base":"docker.io/library/ubuntu:26.04"},
            {"image":"hardening","family":"fedora","base":"quay.io/fedora/fedora-bootc:44"},
            {"image":"changed","family":"fedora","base":"quay.io/fedora/fedora-bootc:44"},
            {"image":"changed","family":"debian","base":"docker.io/library/debian:forky"},
            {"image":"changed","family":"ubuntu","base":"docker.io/library/ubuntu:26.04"}
          ]'
          deb='[
            {"image":"collection","family":"debian","base":"docker.io/library/debian:forky"},
            {"image":"collection","family":"ubuntu","base":"docker.io/library/ubuntu:26.04"}
          ]'
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            printf 'include=%s\n' "$(jq -c . <<< "$always")" >> "$GITHUB_OUTPUT"
          else
            printf 'include=%s\n' "$(jq -c -s add <<< "${always}${deb}")" >> "$GITHUB_OUTPUT"
          fi

  # Deliberately not an `image` in the matrix below: it shares none of that
  # job's steps — no tool, no scaffold, no import, no build — so threading it
  # through them would mean a condition on every one of them.
  packages:
    name: package lists ${{ matrix.family }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: debian
            base: docker.io/library/debian:forky
          - family: ubuntu
            base: docker.io/library/ubuntu:26.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # One `apt-get update` and then one `--dry-run` per module, rather than
      # one over the union: a union says only that something in the collection
      # does not resolve, and the point of the job is to name the module that
      # wrote the line. `--dry-run` resolves dependencies as well as names, so
      # a set apt cannot satisfy fails here too.
      - name: Resolve every package this family declares
        env:
          FAMILY: ${{ matrix.family }}
          BASE: ${{ matrix.base }}
        run: |
          set -euo pipefail
          python3 .github/packages.py "$FAMILY" > lists.txt
          echo "::notice::$(wc -l < lists.txt) modules declare packages for ${FAMILY}"
          sudo podman run --rm -i -v "${PWD}/lists.txt:/lists.txt:ro" "$BASE" \
            bash -euc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              rc=0
              while read -r module packages; do
                if apt-get install --dry-run -qq $packages > /dev/null 2>&1; then
                  printf "ok   %s\n" "$module"
                else
                  printf "FAIL %s\n" "$module"
                  apt-get install --dry-run $packages 2>&1 | grep -E "^E:" | head -3
                  rc=1
                fi
              done < /lists.txt
              exit $rc
            '

  collection:
    name: ${{ matrix.image }} ${{ matrix.family }}
    needs: legs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.legs.outputs.include) }}
    env:
      IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
      IMAGE: ${{ matrix.image }}
      FAMILY: ${{ matrix.family }}
      # goojust pins an asset on a repository that does not resolve yet, and
      # system-menu/power-scripts requires it. Both return when that repository
      # lands.
      SKIP: system-menu/goojust system-menu/power-scripts
      # The walk under `hardening/` finds every hardening mechanism.
      # `signature-policy` is added by name because it is not one: the
      # published hardening image needs the module declaring the cosign
      # public key.
      HARDENING: updates/signature-policy
      # The profile the hardening image is measured by. SSG 0.1.71 carries no
      # CIS profile for Fedora, so a Level 1 floor is not available from this
      # content: the four it carries are cusp_fedora, ospp, pci-dss and
      # standard. cusp_fedora is the Fedora-specific one and the widest, 272
      # rules selected, and it is where the modules moved the score: the bare
      # base fails 18 of it and this image fails 6. standard would be a floor
      # of 5 against a base of 7 and would hold almost nothing.
      CONFORMS: cusp_fedora
      # The floor, chosen on 2026-08-26 at what was measured, and moved only by
      # editing this line. `--baseline` is the other half and a different
      # instrument: it holds the rules and drifts to the last run, so it sees a
      # single rule lost between two runs that both meet this number. Failures
      # rather than passes, because a rule the content stops selecting drops
      # both counts and only one of them is a regression.
      MAX_FAILS: "6"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: ${{ matrix.image == 'changed' && '0' || '1' }}

      - name: Install shfmt
        env:
          SHFMT_VERSION: "3.13.1"
        run: |
          sudo curl -fsSL -o /usr/local/bin/shfmt \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          sudo chmod +x /usr/local/bin/shfmt

      - name: Maximize build space
        run: |
          # the whole collection is a far larger image than any module suggests
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium
          df -h /

      # The runner hands root podman a fuse-overlayfs mount program, which
      # turns off the native overlay diff, so every layer commit walks the
      # whole rootfs: about two minutes a layer whatever the layer holds.
      # Written before anything pulls, so the store is created under the
      # driver it keeps and nothing has to be reset.
      - name: Settle the container storage driver
        run: |
          sudo mkdir -p /etc/containers
          # skopeo reads this file too and, unlike podman, defaults neither
          # path: `containers-storage:` refuses with `runroot must be set`.
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' \
            | sudo tee /etc/containers/storage.conf > /dev/null
          # The config alone changes nothing: the store the runner ships was
          # created with the mount program and keeps the naive diff until it is
          # thrown away. Nothing has pulled yet, so this costs nothing.
          sudo podman system reset --force > /dev/null 2>&1 || true
          # And the reset is not enough on a runner whose store was made before
          # that file existed: its database records an empty graph driver, the
          # reset fails on the inconsistency, `|| true` swallows it, and the
          # next command refuses with `database graph driver "" does not match
          # our graph driver "overlay"`. Measured on four of six legs in one
          # run, moving between legs run to run. Nothing has pulled yet, so
          # removing the store outright costs nothing and leaves no database to
          # disagree with the config.
          sudo rm -rf /var/lib/containers/storage /run/containers/storage
          sudo podman info --format 'storage: {{.Store.GraphDriverName}} {{.Store.GraphOptions}}'

      - name: Install the released tool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/tect"
          mkdir -p "$dir"
          gh release download --repo tectonic-os/tectonic --dir "$dir" \
            --pattern 'tect-v*-x86_64-linux-musl.tar.gz*'
          (cd "$dir" && printf '%s  %s\n' "$(cat ./*.sha256)" ./*.tar.gz \
            | sha256sum --check --status)
          tar -xzf "$dir"/*.tar.gz -C "$dir"
          # The scaffold is data, so pointing its sources block at this
          # checkout is what makes the scaffolded repository import the tree
          # under test rather than the published collection.
          printf 'sources {\n    tectonic-os "%s"\n}\n' "$GITHUB_WORKSPACE" \
            > "${dir}/assets/repo.sources.kdl"
          {
            echo "ROOT=${RUNNER_TEMP}/collection"
            echo "NAMES=${RUNNER_TEMP}/names"
            echo "TECT_BIN=${dir}/tect"
            echo "TECT_ASSETS=${dir}/assets"
          } >> "${GITHUB_ENV}"

      # `find -mindepth 2` rather than `for dir in */`, so a member grouped in a
      # directory is a member. An empty set is a legitimate answer for the
      # changed leg and scaffolds an image listing nothing.
      - name: Choose this leg's modules
        env:
          FROM: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          case "$IMAGE" in
            collection)
              find . -mindepth 2 -name module.kdl -not -path './.*' \
                -printf '%h\n' | sed 's|^\./||' | sort > "$NAMES"
              ;;
            bootc-base)
              find deb-family -mindepth 2 -name module.kdl -printf '%h\n' \
                | sort -u | xargs -r python3 .github/closure.py "$FAMILY" > "$NAMES"
              ;;
            hardening)
              {
                printf '%s\n' $HARDENING
                find hardening -mindepth 2 -name module.kdl -printf '%h\n'
              } | sort -u \
                | xargs -r python3 .github/closure.py "$FAMILY" > "$NAMES"
              ;;
            # `xargs` without `-r`, so the closure runs on an empty set too:
            # a commit touching no module still scaffolds an image, and what
            # the base seeds into it has requirements of its own. With `-r` the
            # closure never ran and the leg scaffolded a `bootc-base` with
            # nothing providing `container-runtime` — measured 2026-09-05.
            changed)
              from="${FROM:-$(git rev-parse -q --verify HEAD^ || true)}"
              : > "$NAMES"
              if [ -n "$from" ]; then
                git diff --name-only "$from" HEAD | while read -r file; do
                  dir="$(dirname "$file")"
                  while [ "$dir" != "." ]; do
                    if [ -f "${dir}/module.kdl" ]; then
                      echo "$dir"
                      break
                    fi
                    dir="$(dirname "$dir")"
                  done
                done | sort -u \
                  | xargs python3 .github/closure.py "$FAMILY" > "$NAMES"
              fi
              ;;
          esac
          echo "::notice::$(wc -l < "$NAMES") modules in the ${IMAGE} leg"
          cat "$NAMES"

      # Every claim in the collection has to sit on a module this leg imports,
      # or the assertion below measures a set that does not contain it.
      - name: Refuse a claim outside the hardening set
        if: matrix.image == 'hardening'
        run: |
          set -euo pipefail
          claiming="$(grep -rl '^satisfies' --include=module.kdl . \
            | sed 's|^\./||;s|/module\.kdl$||' | sort)"
          stray="$(comm -23 <(printf '%s\n' "$claiming") <(sort "$NAMES") || true)"
          if [ -n "$stray" ]; then
            printf '%s\n' "$stray"
            echo '::error::a module declares `satisfies` and no leg measures it'
            exit 1
          fi

      - name: Scaffold a repository on this collection
        env:
          BASE: ${{ matrix.base }}
        run: |
          set -euo pipefail
          "$TECT_BIN" create repo "$IMAGE" --root "$ROOT" --no-tui \
            --owner tectonic-os --host github.com \
            --image "$IMAGE" --base "$BASE"
          # The image file is the interface for a `conforms`, and here it is the
          # only one: `set conforms` is a picker and `--no-tui` refuses to ask
          # rather than reading an answer, which is what the tool's own
          # diagnostic says to do instead. The schema puts it in front of
          # `base`, so the splice is one substitution only while the scaffold
          # holds one image. Both counts are checked rather than presence
          # alone: the sed is global, so a second image would take a `conforms`
          # nothing measured it against and the file would still grep clean.
          if [ "$IMAGE" = hardening ]; then
            image="${ROOT}/${IMAGE}.image.kdl"
            bases="$(grep -c '^    base "' "$image" || true)"
            if [ "$bases" != 1 ]; then
              echo "::error::${image} declares ${bases} images; the conforms splice writes one"
              exit 1
            fi
            sed -i "s|^    base \"|    conforms \"${CONFORMS}\"\n\n    base \"|" \
              "$image"
            wrote="$(grep -cx "    conforms \"${CONFORMS}\"" "$image" || true)"
            if [ "$wrote" != 1 ]; then
              echo "::error::${image} carries ${wrote} of that conforms, expected one"
              exit 1
            fi
          fi
          # Both bootc-base legs build on a plain deb-family container image,
          # which is not a bootc image: `family` and `requires "bootc-base"`
          # are what the catalog writes out of that row, and the
          # `deb-family` set is what satisfies the second.
          #
          # This fixup exists because the leg runs the *released* tool, and the
          # Ubuntu row lands in `assets/bases.kdl` one release after this module
          # support. An uncatalogued base is scaffolded `family "fedora"`, which
          # would select no `packages` batch at all and retain Fedora's
          # `build-disk` workflow. The assertions below are the point and stay.
          case "$FAMILY" in
          debian|ubuntu)
            image="${ROOT}/${IMAGE}.image.kdl"
            sed -i "s|^        family \"fedora\"$|        family \"${FAMILY}\"|" "$image"
            grep -q '^        requires "bootc-base"$' "$image" \
              || sed -i "s|^        family \"${FAMILY}\"$|        family \"${FAMILY}\"\n        requires \"bootc-base\"|" "$image"
            for want in "        family \"${FAMILY}\"" '        requires "bootc-base"'; do
              [ "$(grep -cx "$want" "$image")" = 1 ] || {
                echo "::error::${image} does not carry exactly one \`${want# *}\`"
                exit 1
              }
            done
            if [ "$FAMILY" = ubuntu ]; then
              repo="${ROOT}/repo.kdl"
              sed -i '/^    build-disk$/d' "$repo"
              [ "$(grep -cx '    build-disk' "$repo" || true)" = 0 ] || {
                echo "::error::${repo} still declares build-disk"
                exit 1
              }
            fi
            ;;
          esac
          while read -r name; do
            case " $SKIP " in *" $name "*) continue ;; esac
            grep -q "^supports .*\"${FAMILY}\"" "${name}/module.kdl" || continue
            # `create image` seeds whatever the base `requires` — since
            # v0.6.21 it names the modules that provide the capability and
            # writes them in — so a name can already be listed before this
            # loop reaches it, and importing it twice is an error. Checked
            # against the file rather than against a list of known seeds,
            # because that set grows with the catalog.
            if grep -q "module \"${name}\"" "${ROOT}/${IMAGE}.image.kdl"; then
              continue
            fi
            "$TECT_BIN" import module "tectonic-os/${name}" --root "$ROOT" \
              --image "$IMAGE" --no-tui
            case "$name" in
              boot/cachyos-kernel)
                "$TECT_BIN" create key secureboot --root "$ROOT" --no-tui \
                  --cn "Collection CI"
                ;;
              # Declared by the module rather than by this workflow: an ssh
              # key with no public half is a refusal at `generate`, which is
              # what a repository holding it would hit too. The private half
              # stays on the runner and dies with it.
              login-access)
                "$TECT_BIN" create key ssh --root "$ROOT" --no-tui
                ;;
              updates/signature-policy)
                mkdir -p "$ROOT/keys/public/etc/pki/containers"
                openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 \
                  | openssl pkey -pubout \
                    -out "$ROOT/keys/public/etc/pki/containers/cosign.pub"
                ;;
            esac
          done < "$NAMES"
          cd "$ROOT" && "$TECT_BIN" generate

      - name: Run lint
        run: |
          "${ROOT}/scripts/lint.sh"

      - name: Run the tests the collection ships
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          mapfile -t names < "$NAMES"
          if [ "${#names[@]}" -eq 0 ]; then
            echo "no modules in this leg"
            exit 0
          fi
          mapfile -t dirs < <(find "${names[@]}" -name 'test_*.py' -type f \
            -exec dirname {} \; | sort -u)
          for dir in ${dirs[@]+"${dirs[@]}"}; do
            python3 -m unittest discover -s "$dir" -v
          done

      # Overlap is the discovery, never the exit code. Collect order is
      # declared, so a shared path is resolved rather than a collision: this
      # build is green either way and would be green on two modules setting
      # opposite values in one file, which it cannot see at all.
      - name: Report where modules overlap
        if: matrix.image == 'collection'
        run: |
          set -euo pipefail
          rows="$(jq -r '
            .images[].targets[]
            | (.overlay_overridden[]
               | "- `\(.path)`: `\(.module)` ships it, `\(.by)` wins"),
              (.modules
               | map(.provides[] as $c | {c: $c, m: .path})
               | group_by(.c)[] | select(length > 1)
               | "- `\(.[0].c)`: \(map("`\(.m)`") | join(", "))")
          ' "${ROOT}/generated/plan.json")"
          {
            echo "## Where ${FAMILY} modules overlap"
            echo
            echo "What one module ships and another replaces, and what two of"
            echo "them provide. Read it; it is not a failure."
            echo
            printf '%s\n' "${rows:-None.}"
          } >> "$GITHUB_STEP_SUMMARY"

      # A pull request builds fedora alone, plus `bootc-base`: it is the only
      # leg that compiles a base rather than deriving from one, and its failure
      # modes — the bootc compile, dracut, what is actually inside the
      # initramfs — are all invisible to `generate` and lint, so a pull request
      # that skipped it would not exercise that content at all. It costs a
      # Rust build on every PR; drop the third clause to take that back.
      # The changed leg proves the import and never builds.
      - name: Build
        if: >-
          matrix.image != 'changed'
          && (matrix.family == 'fedora' || matrix.image == 'bootc-base'
              || github.event_name != 'pull_request')
        run: |
          set -euo pipefail
          # Root, because the scan below is `sudo podman run` against the root
          # store: buildah builds straight into it, so there is no archive to
          # export and load.
          # The Containerfile the build is about to run, in a fold. A build
          # that fails inside buildah reports the step it died on and never
          # the file, and a step that reads correctly can still have been
          # parsed wrong — `COPY <<EOF /etc/hostname` failed on the ubuntu leg
          # and passed on the debian one with the same text, which is a
          # difference no log so far can show.
          echo "::group::${IMAGE} Containerfile"
          cat "${ROOT}/generated/${IMAGE}/Containerfile"
          echo "::endgroup::"
          cd "$ROOT" && sudo IMAGE_REGISTRY="$IMAGE_REGISTRY" \
            "$TECT_BIN" build --no-tui

      # The build already ran `bootc container lint`, and it cannot see either
      # of the two things this base got wrong. `Containerfile.skeleton` runs it
      # as `--mount=type=tmpfs,target=/run`, so **content left in /run is
      # masked by construction** — every deb image the tool has ever built
      # carried it and no run said so. And it runs without `--fatal-warnings`,
      # which `bootc container lint` needs to exit non-zero at all: undeclared
      # accounts were reported and the layer passed anyway. Both are the tool's
      # to fix; until it does, the finished image is where a deb base is
      # actually measured, and this is the step that measures it.
      #
      # Both legs, not the Ubuntu one. The /run content is a deb-family fact
      # that Debian carried unnoticed for as long as it has existed, precisely
      # because nothing looked; a check only the newer family runs leaves the
      # older one free to regress. The man page count is the
      # `dpkg.cfg.d/excludes` repair from `deb-family/build-environment`,
      # asserted where it
      # lands rather than where it runs.
      - name: Lint the built base
        if: matrix.image == 'bootc-base'
        run: |
          set -euo pipefail
          sudo podman run --rm --entrypoint '' "${IMAGE}:latest" \
            bootc container lint --fatal-warnings --no-truncate
          pages="$(sudo podman run --rm --entrypoint '' "${IMAGE}:latest" \
            sh -c 'find /usr/share/man/man1 -maxdepth 1 -type f | wc -l')"
          echo "::notice::the ${FAMILY} bootc base carries ${pages} man1 pages"
          [ "$pages" -gt 0 ]

      # What the last scan of this image passed, rule by rule. `tect scap`
      # reads it before it rewrites it, so a regression is one red run and then
      # the new floor, rather than a cache entry somebody has to go and delete.
      - name: Restore the last scan's pass set
        if: matrix.image == 'hardening'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/baseline.json
          key: scap-${{ matrix.image }}-${{ github.run_id }}
          restore-keys: scap-${{ matrix.image }}-

      - name: Install the SSG content
        if: matrix.image == 'hardening'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ssg-base ssg-nondebian
          datastream=/usr/share/xml/scap/ssg/content/ssg-fedora-ds.xml
          [ -s "$datastream" ]
          echo "DATASTREAM=${datastream}" >> "$GITHUB_ENV"

      - name: Confirm the image under test
        if: matrix.image == 'hardening'
        run: |
          set -euo pipefail
          sudo podman image exists "${IMAGE}:latest"
          cp "$DATASTREAM" "${RUNNER_TEMP}/ds.xml"

      - name: Evaluate the rules
        if: matrix.image == 'hardening'
        run: |
          set -euo pipefail
          # The scanner is installed inside the image being measured, over the
          # network, on every scan, so a transient mirror error is the same red X as
          # a false claim. It retries rather than failing the run. The scanner must
          # stay inside the image: scanning a mounted rootfs from outside returns
          # 992 of 994 rules notapplicable.
          sudo podman run --rm --entrypoint "" \
            -v "${RUNNER_TEMP}:/scan:z" "${IMAGE}:latest" \
            sh -c 'n=0
              until dnf -y install openscap-scanner >/dev/null; do
                n=$((n+1))
                [ "$n" -ge 3 ] && exit 1
                dnf clean all
                sleep 15
              done
              oscap xccdf eval --profile "(all)" \
                --results-arf /scan/arf.xml /scan/ds.xml' || true
          [ -s "${RUNNER_TEMP}/arf.xml" ]
          sudo chown "$(id -u):$(id -g)" "${RUNNER_TEMP}/arf.xml"

      - name: Compare what was declared to what was measured
        if: matrix.image == 'hardening'
        run: |
          set -euo pipefail
          # `--base-scan` is the committed bare-base pass set, so a claim the
          # base already passes reads as not load-bearing rather than as this
          # module's work. It adds a column before Result and moves no row.
          report="$("$TECT_BIN" scap "${RUNNER_TEMP}/arf.xml" \
            --root "$ROOT" --target "$IMAGE" --datastream "$DATASTREAM" \
            --base-scan "${GITHUB_WORKSPACE}/.ci/fedora-bootc-44-base-scan.json" \
            --baseline "${RUNNER_TEMP}/baseline.json")"
          printf '%s\n' "$report"
          # The scaffolded repository does not enforce, so `tect scap` reports
          # a bad claim and still exits 0. Every claim row has to be green here
          # or a red collection is the only thing that catches it.
          rows="$(printf '%s\n' "$report" | grep '^| tectonic-os/' || true)"
          if [ -z "$rows" ]; then
            echo '::error::the report declared no claim at all'; exit 1
          fi
          bad="$(printf '%s\n' "$rows" | grep -v '| pass |$' || true)"
          if [ -n "$bad" ]; then
            printf '%s\n' "$bad"
            echo '::error::a declared claim was not measured as passing'; exit 1
          fi

          # The ratchet is red or it is a report nobody acts on. It catches a
          # rule lost between two runs that both meet the floor, which is what
          # a base bump un-hardening the image looks like.
          case "$report" in
            *'this run is the baseline.'* | \
              *'Nothing that passed before stopped passing.'*) ;;
            *)
              echo '::error::a rule that passed the last scan does not now'
              exit 1
              ;;
          esac

          # The floor. The declared profile is the only row carrying the
          # marker, so no row at all means the name is not one the datastream
          # carries, which is the other half of the done-when.
          fails="$(printf '%s\n' "$report" \
            | awk -F'|' '/\(declared\)/ { gsub(/ /, "", $5); print $5 }')"
          if [ -z "$fails" ]; then
            echo "::error::no profile row is declared, so ${CONFORMS} is not a"\
              "profile this datastream carries"
            exit 1
          fi
          echo "::notice::${IMAGE} fails ${fails} of ${CONFORMS}, floor ${MAX_FAILS}"
          if [ "$fails" -gt "$MAX_FAILS" ]; then
            echo "::error::${fails} failures against a declared floor of"\
              "${MAX_FAILS}; fix them, or choose a new floor deliberately"
            exit 1
          fi
          if [ "$fails" -lt "$MAX_FAILS" ]; then
            echo "::notice::the floor is loose and could come down to ${fails}"
          fi

      - name: Save the pass set for the next scan
        if: always() && matrix.image == 'hardening'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/baseline.json
          key: scap-${{ matrix.image }}-${{ github.run_id }}
